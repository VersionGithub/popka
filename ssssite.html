<script>
const cdot=document.getElementById('cur-dot'),cring=document.getElementById('cur-ring');
let mx=0,my=0,rx=0,ry=0;
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;cdot.style.left=mx+'px';cdot.style.top=my+'px'});
(function loop(){rx+=(mx-rx)*.14;ry+=(my-ry)*.14;cring.style.left=rx+'px';cring.style.top=ry+'px';requestAnimationFrame(loop)})();

const splash=document.getElementById('splash');
let splashGone=false;
function dismissSplash(){if(splashGone)return;splashGone=true;splash.classList.add('gone');tryAutoplay()}
splash.addEventListener('click',dismissSplash);
splash.addEventListener('touchend',dismissSplash);

(function(){
  const t=CONFIG.TAB_TEXT;let i=0,dir=1,pause=0;
  setInterval(()=>{if(pause>0){pause--;return}document.title=t.slice(0,i)+(i<t.length?'|':'');i+=dir;if(i>t.length){dir=-1;i=t.length;pause=8}if(i<0){dir=1;i=0;pause=4}},150);
})();

(function(){
  const vid=document.getElementById('bg-video');
  const type=CONFIG.BG_TYPE,size=CONFIG.BG_SIZE||'cover';
  function showImage(src){document.body.style.backgroundImage='url("'+src+'")';document.body.style.backgroundSize=(size==='repeat')?'auto':size;document.body.style.backgroundRepeat=(size==='repeat')?'repeat':'no-repeat';document.body.style.backgroundPosition='center center';vid.style.display='none'}
  function showVideo(src){vid.src=src;vid.style.display='block';vid.play().catch(function(){if(CONFIG.IMAGE_SRC)showImage(CONFIG.IMAGE_SRC)});vid.addEventListener('error',function(){if(CONFIG.IMAGE_SRC)showImage(CONFIG.IMAGE_SRC)},{once:true})}
  if(type==='video'&&CONFIG.VIDEO_SRC)showVideo(CONFIG.VIDEO_SRC);
  else if(CONFIG.IMAGE_SRC)showImage(CONFIG.IMAGE_SRC);
})();

const effects=CONFIG.BG_EFFECTS||[];
function setupCanvas(id){const c=document.getElementById(id),ctx=c.getContext('2d');const r=()=>{c.width=window.innerWidth;c.height=window.innerHeight};r();window.addEventListener('resize',r);return{c,ctx}}
if(effects.includes('tv'))document.getElementById('tv-layer').classList.add('on');
if(effects.includes('snow')){const{c,ctx}=setupCanvas('fx-snow');const fl=Array.from({length:130},()=>({x:Math.random()*window.innerWidth,y:Math.random()*window.innerHeight,r:Math.random()*2+.4,vx:(Math.random()-.5)*.35,vy:Math.random()*.7+.3,a:Math.random()*.55+.15}));(function loop(){ctx.clearRect(0,0,c.width,c.height);fl.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.y>c.height){p.y=-5;p.x=Math.random()*c.width}if(p.x<0)p.x=c.width;if(p.x>c.width)p.x=0;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,'+p.a+')';ctx.fill()});requestAnimationFrame(loop)})()}
if(effects.includes('rain')){const{c,ctx}=setupCanvas('fx-rain');const dr=Array.from({length:220},()=>({x:Math.random()*window.innerWidth,y:Math.random()*window.innerHeight,len:Math.random()*18+8,speed:Math.random()*6+9,a:Math.random()*.3+.08}));(function loop(){ctx.clearRect(0,0,c.width,c.height);dr.forEach(p=>{ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-1.2,p.y+p.len);ctx.strokeStyle='rgba(180,215,255,'+p.a+')';ctx.lineWidth=.9;ctx.stroke();p.y+=p.speed*.15;if(p.y>c.height){p.y=-p.len;p.x=Math.random()*c.width}});requestAnimationFrame(loop)})()}
if(effects.includes('night')){const{c,ctx}=setupCanvas('fx-night');const st=Array.from({length:200},()=>({x:Math.random()*window.innerWidth,y:Math.random()*window.innerHeight*.7,r:Math.random()*1.1+.2,a:Math.random()*.6+.2,tw:Math.random()*3+1,off:Math.random()*Math.PI*2}));let t=0;(function loop(){t+=.016;ctx.clearRect(0,0,c.width,c.height);st.forEach(p=>{const a=p.a*(.55+.45*Math.sin(t/p.tw+p.off));ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,'+a+')';ctx.fill()});requestAnimationFrame(loop)})()}

function renderStaticCard(){const s=CONFIG.CARD_STATIC;document.getElementById('card-top').innerHTML='<span class="card-name">'+s.name+'</span><div class="wealth-pin" data-tip="Rich" style="margin-left:2px"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6"/><text x="10" y="10" dy=".35em" text-anchor="middle" font-size="9" font-weight="700" font-family="Arial,sans-serif" fill="currentColor">$</text></svg></div>';document.getElementById('card-status').innerHTML='<span>'+s.status+'</span>';if(CONFIG.AVATAR_URL)document.getElementById('card-av').src=CONFIG.AVATAR_URL}
function statusColor(s){return{online:'#23a55a',idle:'#f0b232',dnd:'#ed4245',offline:'#80848e'}[s]||'#80848e'}
function applyLanyard(d){
  const sc=statusColor(d.discord_status);
  const dot=document.getElementById('card-dot');
  dot.style.background=sc;dot.style.boxShadow='0 0 8px '+sc;
  const u=d.discord_user;
  if(u.avatar){const av='https://cdn.discordapp.com/avatars/'+u.id+'/'+u.avatar+'.webp?size=128';document.getElementById('card-av').src=av;if(!CONFIG.AVATAR_URL)document.getElementById('main-av').src=av}
  const name=u.display_name||u.global_name||u.username;
  let topHTML='<span class="card-name">'+name+'</span>';
  if(u.primary_guild&&u.primary_guild.tag){let badgeHTML='';if(u.primary_guild.badge&&u.primary_guild.identity_guild_id){const iconUrl='https://cdn.discordapp.com/clan-badges/'+u.primary_guild.identity_guild_id+'/'+u.primary_guild.badge+'.png?size=32';badgeHTML='<img src="'+iconUrl+'" style="width:13px;height:13px;border-radius:3px;object-fit:cover;margin-right:3px;vertical-align:middle"> '}topHTML+='<span class="card-tag tag-blue">'+badgeHTML+u.primary_guild.tag+'</span>'}
  topHTML += '<div class="wealth-pin" data-tip="Rich" style="margin-left:2px"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6"/><text x="10" y="10" dy=".35em" text-anchor="middle" font-size="9" font-weight="700" font-family="Arial,sans-serif" fill="currentColor">$</text></svg></div>';
  document.getElementById('card-top').innerHTML=topHTML;
  const sm={online:'Online',idle:'Idle',dnd:'Do Not Disturb',offline:'Offline'};
  let deviceIcon='';
  if(d.active_on_discord_mobile)deviceIcon='<span class="card-device" title="Mobile"><svg viewBox="0 0 24 24"><path d="M17 2H7a2 2 0 00-2 2v16a2 2 0 002 2h10a2 2 0 002-2V4a2 2 0 00-2-2zm-5 18a1.5 1.5 0 110-3 1.5 1.5 0 010 3zm5-4H7V4h10v12z"/></svg></span>';
  else if(d.active_on_discord_web)deviceIcon='<span class="card-device" title="Browser"><svg viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V6a2 2 0 00-2-2zm0 14H4V8h16v10z"/></svg></span>';
  else deviceIcon='<span class="card-device" title="Desktop"><svg viewBox="0 0 24 24"><path d="M21 2H3a2 2 0 00-2 2v12a2 2 0 002 2h7l-2 3v1h8v-1l-2-3h7a2 2 0 002-2V4a2 2 0 00-2-2zm0 14H3V4h18v12z"/></svg></span>';
  document.getElementById('card-status').innerHTML='<span style="color:'+sc+'">● '+(sm[d.discord_status]||d.discord_status)+'</span>'+deviceIcon;
  if(u.avatar_decoration_data&&u.avatar_decoration_data.asset){const decoUrl='https://cdn.discordapp.com/avatar-decoration-presets/'+u.avatar_decoration_data.asset+'.png?size=96&passthrough=true';let decoEl=document.getElementById('av-deco');if(!decoEl){decoEl=document.createElement('img');decoEl.id='av-deco';decoEl.className='card-av-deco';document.querySelector('.card-av-wrap').appendChild(decoEl)}decoEl.src=decoUrl}
  const actEl=document.getElementById('card-activity');
  const playAct=(d.activities||[]).find(a=>a.type===0);
  const customAct=(d.activities||[]).find(a=>a.type===4);
  if(playAct)actEl.innerHTML='<span>Playing '+playAct.name+'</span>';
  else if(customAct&&customAct.state){const ico=(customAct.emoji&&customAct.emoji.name)?customAct.emoji.name+' ':'';actEl.innerHTML='<span>'+ico+customAct.state+'</span>'}
  else actEl.textContent='';
  document.getElementById('card-guild').style.display='none';
  const spCard=document.getElementById('sp-card');
  if(d.listening_to_spotify&&d.spotify){
    const sp=d.spotify;
    const spTrackEl=document.getElementById('sp-track');
    spTrackEl.innerHTML='<span class="sp-track-inner" id="sp-track-inner">'+sp.song+'</span>';
    setTimeout(()=>{const inner=document.getElementById('sp-track-inner');if(inner&&inner.scrollWidth>spTrackEl.offsetWidth){const offset=-(inner.scrollWidth-spTrackEl.offsetWidth+10);inner.style.setProperty('--offset',offset+'px');inner.classList.add('scroll')}},100);
    document.getElementById('sp-artist').textContent=sp.artist;
    document.getElementById('sp-cover').src=sp.album_art_url;
    spCard.classList.add('on');
    const dur=sp.timestamps.end-sp.timestamps.start;
    const pos=Date.now()-sp.timestamps.start;
    document.getElementById('sp-fill').style.width=Math.min(100,(pos/dur)*100)+'%';
    const fmt=s=>{const t=Math.floor(s/1000);return Math.floor(t/60)+':'+(t%60+'').padStart(2,'0')};
    document.getElementById('sp-cur').textContent=fmt(pos);
    document.getElementById('sp-end').textContent=fmt(dur);
    if(window._spTimer)clearInterval(window._spTimer);
    window._spTimer=setInterval(()=>{const p2=Math.min(100,((Date.now()-sp.timestamps.start)/dur)*100);document.getElementById('sp-fill').style.width=p2+'%';document.getElementById('sp-cur').textContent=fmt(Date.now()-sp.timestamps.start)},1000);
  } else {
    spCard.classList.remove('on');
    if(window._spTimer){clearInterval(window._spTimer);window._spTimer=null}
  }
}

function buildTicker(){
  const track=document.getElementById('ticker-track');if(!track)return;
  const items=[...LANGS,...LANGS];
  items.forEach((lang,idx)=>{
    const item=document.createElement('span');
    item.className='ticker-item'+(lang.main?' ticker-main':'');
    item.setAttribute('data-tip',lang.years+'  ·  in '+lang.since);
    item.innerHTML=lang.svg+lang.name;
    item.addEventListener('mouseenter',showTip);
    item.addEventListener('mouseleave',hideTip);
    track.appendChild(item);
    if(idx<items.length-1){const sep=document.createElement('span');sep.className='ticker-sep';track.appendChild(sep)}
  });
}
const tipEl=document.createElement('div');
tipEl.style.cssText='position:fixed;z-index:9000;background:rgba(15,13,22,.92);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:7px 13px;font-size:.72rem;color:rgba(255,255,255,.85);pointer-events:none;opacity:0;transition:opacity .18s ease;white-space:nowrap;backdrop-filter:blur(12px);box-shadow:0 4px 20px rgba(0,0,0,.5);letter-spacing:.04em;';
document.body.appendChild(tipEl);
function showTip(e){const txt=e.currentTarget.getAttribute('data-tip');if(!txt)return;tipEl.textContent=txt;tipEl.style.opacity='1';moveTip(e);e.currentTarget.addEventListener('mousemove',moveTip)}
function hideTip(e){tipEl.style.opacity='0';e.currentTarget.removeEventListener('mousemove',moveTip)}
function moveTip(e){tipEl.style.left=(e.clientX+14)+'px';tipEl.style.top=(e.clientY-36)+'px'}
buildTicker();

const au=new Audio();au.volume=.65;let ti=0,isPlaying=false;
function fmt(s){if(!s||isNaN(s))return'0:00';const m=Math.floor(s/60);return m+':'+(Math.floor(s%60)+'').padStart(2,'0')}
function loadTrack(i,andPlay){const t=CONFIG.PLAYLIST[i];document.getElementById('mp-track-head').textContent=t.track+' — '+t.artist;document.getElementById('mp-fill').style.width='0%';au.src=t.url;if(andPlay)au.play().catch(()=>{})}
function setPlaying(v){isPlaying=v;document.getElementById('mp-play').textContent=v?'⏸':'▶';document.getElementById('mp-dot').classList.toggle('on',v)}
function playAu(){au.play().then(()=>setPlaying(true)).catch(()=>{})}
function pauseAu(){au.pause();setPlaying(false)}
function playPause(){isPlaying?pauseAu():playAu()}
function nextT(){ti=(ti+1)%CONFIG.PLAYLIST.length;loadTrack(ti,isPlaying)}
function prevT(){ti=(ti-1+CONFIG.PLAYLIST.length)%CONFIG.PLAYLIST.length;loadTrack(ti,isPlaying)}
au.addEventListener('ended',nextT);
au.addEventListener('timeupdate',()=>{if(!au.duration||isNaN(au.duration))return;document.getElementById('mp-fill').style.width=(au.currentTime/au.duration*100)+'%'});
function seekAu(e){const b=document.getElementById('mp-prog');const p=Math.max(0,Math.min(1,e.offsetX/b.offsetWidth));if(au.duration&&!isNaN(au.duration))au.currentTime=p*au.duration}
let pCol=false;
function togglePlayer(){pCol=!pCol;document.getElementById('mplayer').classList.toggle('col',pCol);document.getElementById('mp-tog').textContent=pCol?'▴':'▾'}
loadTrack(0,false);
function tryAutoplay(){if(isPlaying)return;au.play().then(()=>setPlaying(true)).catch(()=>{})}
